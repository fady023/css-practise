<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/local_storage_style.css">
</head>

<body>
    <section class="container">

        <div class="product">
            <img src="imgs/camera.jfif" alt="">
            <p> canoon 4k camera </p>
            <span> 20$ </span>
            <button onclick="addtocart('camera',20)"> add to cart </button>
        </div>

        <div class="product">
            <img src="imgs/headphone.jfif" alt="">
            <p> Anker wireless headphone </p>
            <span> 10$ </span>
            <button onclick="addtocart('headphone',10)"> add to cart </button>
        </div>

    </section>

    <div class="cart">
        <h2>Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total price : <span id="total"> </span> $</p>
    </div>


    <script>

        var cartitems = [];
        var carttotal = 0;

        window.onload = function () {
            var stored_data = JSON.parse(localStorage.getItem("cartitems"));
            if (stored_data && stored_data.length > 0) {

                cartitems = stored_data;
                update();
            };
        }

        function update() {
            var items = document.querySelector("#cart-items");
            var total_span = document.querySelector("#total");
            items.innerHTML = "";
            var total = 0;

            for (var el of cartitems) {
                var li = document.createElement("li");
                li.innerHTML = " <b>Name</b> : " + el.proname + "<b> Price </b>: " + el.price + " <b>quantity : </b>" + el.quantity;
                items.appendChild(li);
                total += (el.quantity * el.price);
                total_span.textContent = total;

            }
        }

        function addtocart(itemname, itemprice) {

            var existing_item = cartitems.find((x) => {
                return x.proname == itemname;
            })

            if (existing_item) {
                existing_item.quantity++;

            } else {
                cartitems.push({ proname: itemname, price: itemprice, quantity: 1 });
            }

            carttotal += itemprice;

            localStorage.setItem("cartitems", JSON.stringify(cartitems));

            update();

        }

    </script>
</body>

</html>
